<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173c35" />
    <meta
      name="description"
      content="中国大陆 PMP 180题学习平台，包含全程训练、间隔复习、考点诊断、Excel导入与账号同步。"
    />
    <title>PMP 学习平台 · 复习与考点诊断</title>
    <style>:root {
  font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #233b36;
  background: #f5f6f2;
  font-synthesis: none;
  --green: #173c35;
  --muted: #77827d;
  --line: #e4e8e1;
  --orange: #e7a266;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: inherit;
}
button {
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #cb8c50;
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -1px;
}
h2 {
  font-size: 20px;
  font-weight: 650;
}
h3 {
  font-size: 16px;
}
p {
  line-height: 1.8;
}
.sidebar {
  width: 246px;
  background: #fff;
  position: fixed;
  inset: 0 auto 0 0;
  border-right: 1px solid var(--line);
  padding: 32px 22px;
  display: flex;
  flex-direction: column;
  z-index: 10;
}
.brand {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 18px;
  font-weight: 700;
}
.brand-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 44px;
  background: var(--green);
  color: #fff;
  font-size: 28px;
  border-radius: 13px;
}
.brand-mark span {
  color: var(--orange);
}
.brand small {
  display: block;
  font-size: 7px;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-top: 6px;
}
.nav-caption {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #9aa39d;
  margin: 47px 12px 17px;
}
nav {
  display: grid;
  gap: 8px;
}
nav button {
  display: flex;
  gap: 14px;
  align-items: center;
  text-align: left;
  padding: 14px 15px;
  border-radius: 9px;
  font-size: 18px;
  color: #7c8881;
}
nav button span {
  font-size: 14px;
}
nav button.active {
  background: #eaf0e9;
  color: var(--green);
  font-weight: 650;
}
nav button:hover {
  background: #f2f5ef;
}
nav b {
  margin-left: auto;
  font-size: 11px;
  background: #dbe5d8;
  padding: 2px 7px;
  border-radius: 5px;
}
.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 23px 10px 0;
  font-size: 12px;
}
.sidebar-bottom small {
  display: block;
  color: #949c96;
  line-height: 1.9;
  margin-top: 10px;
  font-size: 10px;
}
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 100%;
  background: #7d9d6d;
  margin-right: 5px;
}
.main {
  margin-left: 246px;
}
.topbar {
  height: 83px;
  padding: 0 45px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #7b867f;
  background: #fff9;
}
.crumb {
  margin: 0 14px;
  color: #c1c8c0;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.draft-pill {
  font-size: 10px;
  color: #7a856e;
  border: 1px solid #dce2d2;
  background: #f3f5eb;
  border-radius: 20px;
  padding: 6px 10px;
}
.avatar {
  display: grid;
  place-items: center;
  background: #e6eade;
  width: 31px;
  height: 31px;
  border-radius: 100%;
  font-size: 12px;
  color: #587247;
}
main {
  max-width: 1270px;
  padding: 38px 45px 24px;
  margin: auto;
  min-height: calc(100vh - 144px);
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  color: #9a7c57;
  font-weight: 650;
  margin-bottom: 10px;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 27px;
}
.page-head p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
}
.subtle {
  font-size: 12px;
  color: var(--muted);
}
.date {
  font-size: 11px;
  white-space: nowrap;
  color: var(--muted);
  padding-top: 16px;
}
.hero {
  background: var(--green);
  color: #fff;
  border-radius: 15px;
  display: grid;
  grid-template-columns: 1fr 180px;
  padding: 34px 36px;
  position: relative;
  overflow: hidden;
  gap: 20px;
}
.hero:after {
  content: "";
  position: absolute;
  right: -76px;
  top: -122px;
  width: 375px;
  height: 375px;
  border: 1px solid #ffffff14;
  border-radius: 50%;
  pointer-events: none;
}
.hero .eyebrow {
  color: #b3c1a4;
}
.hero h2 {
  font-size: 27px;
  line-height: 1.5;
  font-weight: 550;
  letter-spacing: 0.5px;
}
.hero p {
  color: #c0cdc5;
  font-size: 12px;
  margin-top: 10px;
  max-width: 560px;
}
.primary,
.secondary,
.outline-light {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 12px 20px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  min-height: 43px;
  text-decoration: none;
}
.primary {
  background: var(--green);
  color: #fff;
}
.primary:hover {
  background: #28564b;
}
.hero .primary {
  background: #edb07d;
  color: #243c32;
  margin-top: 22px;
}
.secondary {
  background: #fff;
  border: 1px solid var(--line);
}
.secondary:hover {
  background: #f0f3ec;
}
.outline-light {
  border: 1px solid #ffffff30;
  color: #fff;
}
.hero-art {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
.orbit {
  width: 125px;
  height: 125px;
  border: 1px solid #bdd1b84d;
  border-radius: 100%;
  display: grid;
  place-items: center;
  transform: rotate(-12deg);
}
.orbit:before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border: 1px dashed #bdd1b84d;
  border-radius: 100%;
}
.orbit span {
  font-size: 56px;
  color: #c3d0ab;
  transform: rotate(12deg);
}
.orbit i {
  width: 24px;
  height: 24px;
  background: #eeb382;
  color: #23463d;
  border-radius: 6px;
  position: absolute;
  right: -15px;
  top: 8px;
  font-style: normal;
  display: grid;
  place-items: center;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin: 23px 0 33px;
}
.stat {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 19px 20px;
}
.stat-label {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.stat-number {
  font-size: 28px;
  font-weight: 550;
  margin-top: 13px;
  color: #25493c;
}
.stat-number small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 5px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 26px 0 17px;
}
.section-title h2 {
  font-size: 17px;
}
.section-title span {
  font-size: 11px;
  color: var(--muted);
}
.mode-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
}
.mode-card {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 11px;
  padding: 23px;
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transition:
    transform 0.18s,
    border-color 0.18s;
}
.mode-card:hover {
  transform: translateY(-3px);
  border-color: #9bae91;
}
.mode-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 21px;
  background: #edf1e6;
  color: #657a46;
}
.mode-card:nth-child(2) .mode-icon {
  background: #f9eee1;
  color: #b88248;
}
.mode-card:nth-child(3) .mode-icon {
  background: #eef0f5;
  color: #76829d;
}
.mode-card h3 {
  margin-bottom: 9px;
}
.mode-card p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.9;
  min-height: 43px;
}
.card-bottom {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid #f0f1ed;
  font-size: 10px;
  color: #8a948d;
}
.card-bottom b {
  font-size: 16px;
  color: var(--green);
}
.lower-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 20px;
}
.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 25px;
}
.domain-row {
  margin-top: 22px;
}
.domain-top {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 9px;
}
.bar {
  height: 6px;
  border-radius: 10px;
  background: #eff1ea;
  overflow: hidden;
}
.bar span {
  display: block;
  height: 100%;
  background: #9cae82;
  border-radius: 10px;
}
.domain-row:nth-of-type(2) .bar span {
  background: #b6a081;
}
.domain-row:nth-of-type(3) .bar span {
  background: #91aaa4;
}
.tip {
  font-size: 12px;
  color: #718078;
  margin-top: 13px;
}
.note {
  background: #f2f3eb;
  border-left: 3px solid #bdc59d;
  padding: 14px 17px;
  font-size: 11px;
  line-height: 1.9;
  color: #747c65;
  margin-top: 20px;
  border-radius: 0 6px 6px 0;
}
.resume {
  border: 1px solid #b7c8ae;
  background: #edf2e6;
  padding: 16px 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
  font-size: 13px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 25px 0;
}
.field {
  display: grid;
  gap: 9px;
  font-size: 12px;
  color: #68796e;
}
select,
input[type="number"] {
  border: 1px solid #d7dfd2;
  background: #fff;
  border-radius: 7px;
  padding: 12px;
  width: 100%;
  color: #233b36;
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 22px;
}
.setup {
  max-width: 760px;
  margin: 0 auto;
}
.setup .panel {
  padding: 30px;
}
.empty {
  padding: 50px 20px;
  text-align: center;
  color: #7b877e;
}
.empty .mode-icon {
  margin: 0 auto 20px;
}
.empty h2 {
  color: #344c40;
  margin-bottom: 12px;
}
.quiz-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 22px;
}
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 21px;
  font-weight: 600;
  color: var(--green);
}
.timer.urgent {
  color: #b65739;
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  font-size: 10px;
  padding: 5px 9px;
  border-radius: 5px;
  background: #eef2e9;
  color: #6b7e60;
}
.question {
  font-size: 19px;
  line-height: 1.85;
  font-weight: 550;
  margin: 23px 0 25px;
}
.options {
  display: grid;
  gap: 12px;
}
.option {
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  gap: 13px;
  padding: 15px 16px;
  align-items: flex-start;
  font-size: 14px;
  line-height: 1.7;
  cursor: pointer;
}
.option:has(input:checked) {
  border-color: #5e8165;
  background: #f0f5e9;
}
.option input {
  margin-top: 5px;
  accent-color: var(--green);
}
.option.good {
  border-color: #79a07e;
  background: #f1f7ed;
}
.option.bad {
  border-color: #d09a80;
  background: #fdf4ef;
}
.option b {
  font-size: 12px;
  font-weight: 500;
  color: #8b968b;
}
.rationale {
  background: #f4f6ef;
  border-radius: 9px;
  padding: 20px;
  margin-top: 22px;
  font-size: 12px;
  line-height: 1.8;
}
.rationale h3 {
  margin-bottom: 15px;
}
.rationale p {
  margin-top: 10px;
}
.rationale strong {
  color: #355c3e;
}
.quiz-side .panel {
  padding: 20px;
  position: sticky;
  top: 20px;
}
.number-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 18px;
}
.num {
  height: 31px;
  font-size: 11px;
  border: 1px solid var(--line);
  border-radius: 5px;
  position: relative;
}
.num.answered {
  background: #dce8d6;
  border-color: #dce8d6;
}
.num.current {
  box-shadow: 0 0 0 2px #325943;
}
.num.flagged:after {
  content: "";
  position: absolute;
  top: 1px;
  right: 1px;
  width: 5px;
  height: 5px;
  background: #cf9958;
  border-radius: 50%;
}
.legend {
  font-size: 10px;
  line-height: 2;
  color: var(--muted);
  margin-top: 16px;
}
.score-card {
  text-align: center;
  padding: 36px;
}
.score-number {
  font-size: 65px;
  color: var(--green);
  font-weight: 550;
  margin: 20px 0 10px;
}
.score-number small {
  font-size: 21px;
}
.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
}
.result-mini {
  background: #f4f6ef;
  padding: 18px;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
}
.result-mini strong {
  display: block;
  font-size: 23px;
  margin-top: 10px;
  font-weight: 550;
}
.review-item {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  margin: 12px 0;
  padding: 18px;
  font-size: 13px;
  line-height: 1.8;
}
.review-item summary {
  cursor: pointer;
  font-weight: 550;
}
.review-item p {
  margin-top: 14px;
}
.review-item .rationale p {
  font-size: 12px;
}
.history-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  gap: 15px;
}
.history-row:last-child {
  border-bottom: 0;
}
.history-row strong {
  font-size: 13px;
}
.history-row small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 7px;
}
.history-percent {
  font-size: 24px;
  font-weight: 550;
}
.source-link {
  display: block;
  font-size: 13px;
  margin: 14px 0;
  color: #315a48;
  text-decoration: none;
  line-height: 1.8;
}
.source-link small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}
.pill-link {
  font-size: 11px;
  color: #718562;
  text-decoration: none;
}
footer {
  text-align: center;
  color: #9aa195;
  font-size: 10px;
  padding: 20px 15px 25px;
  line-height: 1.8;
}
#toast {
  position: fixed;
  bottom: 25px;
  left: calc(50% + 100px);
  transform: translateX(-50%);
  background: #213e33;
  color: #fff;
  z-index: 50;
  border-radius: 8px;
  padding: 13px 20px;
  font-size: 12px;
  max-width: 90vw;
  display: none;
  box-shadow: 0 6px 30px #233b3630;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px;
  max-width: 440px;
  width: 90%;
  color: #233b36;
}
dialog::backdrop {
  background: #132b2455;
}
dialog p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 15px;
}
.warning {
  font-size: 12px;
  color: #a14b2d;
  background: #fff2e9;
  padding: 12px;
  border-radius: 7px;
  margin-top: 15px;
}
.hidden {
  display: none !important;
}
.bank-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  margin: 20px 0;
}
.progress-line {
  height: 4px;
  border-radius: 5px;
  background: #e9ede3;
  margin-top: 18px;
  overflow: hidden;
}
.progress-line span {
  display: block;
  height: 100%;
  background: #97ad7b;
}
@media (min-width: 1500px) {
  main {
    padding-top: 48px;
  }
}
@media (max-width: 1100px) {
  .sidebar {
    width: 210px;
    padding: 30px 15px;
  }
  .main {
    margin-left: 210px;
  }
  main {
    padding: 30px;
  }
  .topbar {
    padding: 0 30px;
  }
  .hero {
    grid-template-columns: 1fr 140px;
    padding: 28px;
  }
  .mode-card {
    padding: 19px;
  }
  .quiz-layout {
    grid-template-columns: minmax(0, 1fr) 180px;
  }
  .stats {
    gap: 10px;
  }
  .stat {
    padding: 16px;
  }
}
@media (max-width: 800px) {
  .sidebar {
    position: static;
    width: auto;
    padding: 16px 20px 0;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-size: 16px;
  }
  .brand-mark {
    width: 34px;
    height: 35px;
    font-size: 23px;
  }
  .brand small {
    font-size: 6px;
  }
  .nav-caption,
  .sidebar-bottom {
    display: none;
  }
  nav {
    display: flex;
    overflow-x: auto;
    gap: 3px;
    margin-top: 15px;
    padding-bottom: 10px;
  }
  nav button {
    white-space: nowrap;
    padding: 10px;
    font-size: 14px;
    gap: 6px;
    flex-shrink: 0;
  }
  nav button span {
    font-size: 12px;
  }
  nav b {
    display: none;
  }
  .main {
    margin-left: 0;
  }
  .topbar {
    height: 55px;
    padding: 0 22px;
  }
  .top-right {
    gap: 10px;
  }
  .draft-pill {
    font-size: 9px;
  }
  main {
    padding: 25px 22px;
  }
  .page-head {
    margin-bottom: 23px;
  }
  h1 {
    font-size: 26px;
  }
  .hero {
    grid-template-columns: 1fr 100px;
    padding: 25px;
  }
  .hero h2 {
    font-size: 23px;
  }
  .orbit {
    width: 85px;
    height: 85px;
  }
  .orbit:before {
    width: 110px;
    height: 110px;
  }
  .orbit span {
    font-size: 40px;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
    margin-bottom: 26px;
  }
  .mode-grid {
    gap: 10px;
  }
  .mode-card {
    padding: 16px;
  }
  .mode-card h3 {
    font-size: 14px;
  }

      try {
        this.db = await new Promise((resolve, reject) => {
          const request = indexedDB.open("pmp-room", 1);
          request.onupgradeneeded = () => request.result.createObjectStore("states");
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          request.onblocked = () => reject(Error("\u672C\u673A\u8BB0\u5F55\u5B58\u50A8\u88AB\u5176\u4ED6\u7A97\u53E3\u963B\u585E"));
        });
        this.db.onversionchange = () => {
          this.db.close();
          this.db = null;
        };
      } catch {
        this.db = null;
      }
    }
    async read(key) {
      if (this.db) {
        const value = await new Promise((resolve, reject) => {
          const tx = this.db.transaction("states", "readonly"), request = tx.objectStore("states").get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        if (value !== void 0) return value;
      }
      return JSON.parse(localStorage.getItem(key) || "null");

        return Promise.resolve();

        tx.oncomplete = () => {

          } catch {
          }

    ) + `<section class="panel"><form id="setup-form" data-mode="${mode}"><div class="form-grid">${filtersHTML()}<label class="field">\u62BD\u53D6\u9898\u6570<input id="count" type="number" min="1" max="${qs.length}" value="${Math.min(exam ? 90 : 10, qs.length)}" required></label>${exam ? '<label class="field">\u4F5C\u7B54\u65F6\u95F4\uFF08\u5206\u949F\uFF09<input id="minutes" type="number" min="1" max="300" value="120" required></label>' : '<label class="field">\u9898\u76EE\u987A\u5E8F<select id="order"><option value="new">\u672A\u505A\u9898\u4F18\u5148</option><option value="random">\u968F\u673A\u987A\u5E8F</option><option value="ordered">\u9898\u5E93\u987A\u5E8F</option></select></label>'}</div><label class="check-field"><input id="shuffle-options" type="checkbox" checked> \u6253\u4E71\u9009\u9879\u987A\u5E8F\uFF0C\u907F\u514D\u8BB0\u4F4F\u7B54\u6848\u4F4D\u7F6E</label><p id="pool-count" class="tip">\u5F53\u524D\u53EF\u7528${qs.length}\u9898\u3002</p><div class="note">${exam ? "180\u9898/240\u5206\u949F\u4E3A\u5168\u7A0B\u8BAD\u7EC3\uFF0C90\u9898/120\u5206\u949F\u4E3A\u534A\u7A0B\u8BAD\u7EC3\u3002\u672C\u5E73\u53F0\u6240\u6709\u8BAD\u7EC3\u9898\u5747\u8BA1\u5206\uFF1B\u6309\u5927\u9646\u5927\u7EB2\u8BAD\u7EC3\uFF0C\u4E0D\u590D\u523B\u6B63\u5F0F\u8003\u8BD5\u5168\u90E8\u8003\u52A1\u89C4\u5219\u3002" : "\u7EC3\u4E60\u4E2D\u672A\u7B54\u9898\u5355\u72EC\u8BB0\u5F55\uFF0C\u4E0D\u8BA1\u5165\u9519\u9898\u6216\u5DF2\u7B54\u6B63\u786E\u7387\u3002\u6807\u8BB0\u201C\u4E0D\u786E\u5B9A\u201D\u7684\u9898\uFF0C\u5373\u4F7F\u7B54\u5BF9\uFF0C\u4E5F\u4F1A\u5B89\u6392\u590D\u4E60\u3002"}</div><div class="actions"><button class="primary" type="submit">${exam ? "\u5F00\u59CB\u8BA1\u65F6\u8BAD\u7EC3" : "\u5F00\u59CB\u7EC3\u4E60"} \u2192</button>${mode === "wrong" ? '<button class="secondary" type="button" data-action="review-due">\u53EA\u7EC3\u4ECA\u5929\u5230\u671F\u9898</button>' : ""}</div></form></section>`;

  function rationaleHTML(q, answers, order = q.options.map((_, i) => i), confidence = "sure") {

    <aside class="quiz-side"><div class="panel"><h3>\u7B54\u9898\u5BFC\u822A</h3><div class="progress-line"><span style="width:${Object.values(s.answers).filter((a) => a.length).length / qs.length * 100}%"></span></div><div class="number-grid">${qs.map((x, i) => `<button class="num ${i === s.index ? "current" : ""} ${s.answers[x.id]?.length ? "answered" : ""} ${s.flags.includes(x.id) ? "flagged" : ""}" aria-label="\u7B2C${i + 1}\u9898" data-index="${i}">${i + 1}</button>`).join("")}</div><p class="legend">\u6D45\u7EFF\uFF1A\u5DF2\u9009\u62E9\u7B54\u6848 \xB7 \u5706\u70B9\uFF1A\u5DF2\u6807\u8BB0<br>${s.deadline ? "\u9000\u51FA\u6216\u5237\u65B0\u4E0D\u4F1A\u6682\u505C\u8BA1\u65F6\u3002" : "\u672A\u7B54\u9898\u4E0D\u8BA1\u5165\u9519\u9898\u3002"}<br>\u5FEB\u6377\u952E\uFF1A1\u20138\u9009\u9879\uFF0CEnter\u63D0\u4EA4\uFF0C\u2190/\u2192\u6362\u9898\uFF0CF\u6807\u8BB0\u3002</p><button class="primary" style="width:100%" data-action="finish">${s.mode === "exam" ? "\u4EA4\u5377\u5E76\u590D\u76D8" : "\u7ED3\u675F\u672C\u7EC4\u7EC3\u4E60"}</button></div></aside></div>

  function resultView() {

  function updateCatalog() {
    const qs = filterQuestions(bank, filterValues()), size = 20, totalPages = Math.max(1, Math.ceil(qs.length / size));

    document.querySelector("#catalog-count").textContent = `\u5339\u914D${qs.length}\u9898 \xB7 \u7B2C${catalogPage + 1}/${totalPages}\u9875`;
    document.querySelector("#catalog-list").innerHTML = qs.slice(catalogPage * size, (catalogPage + 1) * size).map(
      (q) => `<div class="catalog-item"><div class="chips"><span class="chip">${esc(q.id)}</span><span class="chip">${esc(q.taskId || "\u672A\u5B9A\u4F4D")}</span><span class="chip">${esc(q.difficulty || "\u672A\u6807\u5B9A")}</span>${q.case ? '<span class="chip">\u6848\u4F8B</span>' : ""}${state.issues[q.id]?.text ? '<span class="chip reported">\u5DF2\u6807\u7591</span>' : ""}</div><h3>${esc(q.stem)}</h3><p class="tip">${esc(q.topic)} \xB7 ${esc(q.domain)} \xB7 ${esc(q.approach)} \xB7 ${questionStats(state, q.id).attempts ? "\u5DF2\u7EC3" : "\u672A\u505A"}</p>${qualityHTML(q)}<button class="secondary" data-practice-id="${esc(q.id)}">\u7EC3\u8FD9\u9053\u9898 \u2192</button></div>`
    ).join("") + `<div class="actions"><button class="secondary" data-action="catalog-prev" ${catalogPage === 0 ? "disabled" : ""}>\u4E0A\u4E00\u9875</button><button class="secondary" data-action="catalog-next" ${catalogPage === totalPages - 1 ? "disabled" : ""}>\u4E0B\u4E00\u9875</button></div>`;
  }

  function syncView() {
    return head(

    ) + `<section class="panel"><div class="chips"><span class="chip">${esc(syncStatus)}</span></div><h2 style="margin-top:20px">${user ? esc(user.email || "\u5DF2\u767B\u5F55\u8D26\u53F7") : "\u5F53\u524D\u4E3A\u672C\u673A\u6A21\u5F0F"}</h2><p class="tip">${user ? "\u7B54\u9898\u4E8B\u4EF6\u3001\u95F4\u9694\u590D\u4E60\u3001\u6536\u85CF\u3001\u7B14\u8BB0\u548C\u8FDB\u5EA6\u6309\u5F53\u524D\u8D26\u53F7\u4FDD\u5B58\u3002\u4E24\u53F0\u8BBE\u5907\u66F4\u65B0\u4F1A\u5148\u5408\u5E76\uFF0C\u518D\u540C\u6B65\uFF1B\u540C\u4E00\u573A\u7B54\u9898\u6309\u9898\u76EE\u5408\u5E76\u9009\u62E9\uFF0C\u5DF2\u7ED3\u675F\u72B6\u6001\u4E0D\u4F1A\u88AB\u65E7\u8FDB\u5EA6\u6062\u590D\u3002" : "\u672C\u5730HTML\u6587\u4EF6\u65E0\u9700\u767B\u5F55\u3002\u82E5\u5E0C\u671B\u8DE8\u8BBE\u5907\u7EE7\u7EED\u5B66\u4E60\uFF0C\u8BF7\u6253\u5F00\u5728\u7EBF\u7248\u5E76\u4F7F\u7528\u76F8\u540C\u90AE\u7BB1\u767B\u5F55\u3002"}</p><div class="actions">${cloud ? '<button class="primary" data-action="sync-now">\u7ACB\u5373\u540C\u6B65\u5E76\u68C0\u67E5\u53E6\u4E00\u8BBE\u5907\u66F4\u65B0</button>' : ""}<button class="secondary" data-action="export-backup">\u5BFC\u51FA\u5907\u4EFD</button><button class="secondary" data-action="import-backup">\u5408\u5E76\u5907\u4EFD</button></div><div class="note">\u6E05\u7406\u6D4F\u89C8\u5668\u6570\u636E\u524D\u5EFA\u8BAE\u786E\u8BA4\u5DF2\u540C\u6B65\u6216\u5BFC\u51FA\u5907\u4EFD\u3002\u4E24\u53F0\u8BBE\u5907\u8BF7\u907F\u514D\u540C\u65F6\u7EE7\u7EED\u540C\u4E00\u573A\u9650\u65F6\u8BAD\u7EC3\uFF1B\u6B63\u5F0F\u8BAD\u7EC3\u8BA1\u65F6\u4E0D\u4F1A\u56E0\u5207\u6362\u8BBE\u5907\u6682\u505C\u3002</div></section>`;

  function importView() {

      toast("\u90E8\u5206\u672C\u673A\u8BB0\u5F55\u65E0\u6CD5\u8BFB\u53D6\uFF0C\u539F\u59CB\u8BB0\u5F55\u672A\u88AB\u5220\u9664\uFF1B\u53EF\u4EE5\u4ECE\u5907\u4EFD\u6062\u590D\u3002");
    }
    refreshBank();
    render();
    if (user) {
      cloud = new CloudSync({
        getState: () => state,
        replaceState: (value) => {
          const index = active()?.index;
          settleTime();
          state = mergeStates(state, value);
          if (page === "quiz" && active() && !active().finishedAt && Number.isInteger(index))
            active().index = index;
          refreshBank();
        },
        persist,
        onStatus: (level, message) => {
          syncLevel = level;
          syncStatus = message;
          updateStatus();
        },
        onRemote: () => {
          if (page === "quiz") {
            const s = active();
            if (s?.finishedAt) {
              resultId = s.id;
              page = "result";
              render();
            } else if (!document.activeElement?.closest("textarea")) render();
            else beginTime();
          } else if ([
            "home",
            "diagnostics",
            "history",
            "library",
            "sync",
            "result"
          ].includes(page) && !document.querySelector("#confirm-dialog").open)
            render();
        }
      });
      cloud.start();
    } else {
      syncStatus = location.protocol === "file:" ? "\u514D\u767B\u5F55 \xB7 \u672C\u673A\u4FDD\u5B58" : "\u672C\u673A\u4FDD\u5B58 \xB7 \u4E91\u540C\u6B65\u672A\u8FDE\u63A5";
      updateStatus();
    }
    const hash = location.hash.slice(1);
    if (hash === "start") {
      const unfinished = Object.values(state.sessions).filter((s) => !s.finishedAt).sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (unfinished) {
        activeId = unfinished.id;
        go("quiz");
      } else begin("practice", sampleFresh(10), { label: "10\u9898\u70ED\u8EAB" });
    } else if (labels[hash] && !["quiz", "result", "import"].includes(hash))
      go(hash);
  }
  validateBank(seedBank);
  boot();
})();

})();</script>
