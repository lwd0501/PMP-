<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173c35" />
    <meta
      name="description"
      content="中国大陆 PMP 180题学习平台，包含全程训练、间隔复习、考点诊断、Excel导入与账号同步。"
    />
    <title>PMP 学习平台 · 复习与考点诊断</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#home"
        ><span class="brand-mark">P<span>·</span></span
        ><span>PMP 练习室<small>PROJECT MANAGEMENT PRACTICE</small></span></a
      >
      <div class="nav-caption">我的学习空间</div>
      <nav aria-label="主导航">
        <button data-page="home">◈ <span>学习概览</span></button
        ><button data-page="practice">▤ <span>情境练习</span></button
        ><button data-page="exam">◷ <span>模拟训练</span></button
        ><button data-page="wrong">
          ↻ <span>间隔复习</span><b id="wrong-count">0</b></button
        ><button data-page="favorites">☆ <span>我的收藏</span></button
        ><button data-page="diagnostics">↗ <span>考点诊断</span></button
        ><button data-page="catalog">⌕ <span>题库检索</span></button
        ><button data-page="history">▥ <span>学习记录</span></button
        ><button data-page="library">▦ <span>题库与资料</span></button
        ><button data-page="sync">⇄ <span>账号与同步</span></button>
      </nav>
      <div class="sidebar-bottom">
        <span class="live-dot"></span
        ><button id="sync-status" data-page="sync">正在读取记录</button
        ><small>同一账号继续学习<br />离线时保留本机记录</small>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <span
          >学习空间 <span class="crumb">/</span>
          <span id="page-label">学习概览</span></span
        >
        <div class="top-right">
          <span class="draft-pill">180题 · 复习与诊断</span
          ><span class="avatar">L</span>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
      <footer>
        独立学习工具 · 非 PMI 官方产品 · AI辅助逻辑复查 · 待独立专家复核 ·
        练习成绩不代表考试通过概率
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="dialog-title">确认操作</h2>
        <p id="dialog-text"></p>
        <div class="actions">
          <button value="cancel" class="secondary">返回</button
          ><button id="dialog-ok" value="ok" class="primary">确认</button>
        </div>
      </form>
    </dialog>
    <input id="file-input" type="file" accept=".json,application/json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
